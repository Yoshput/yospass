<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian / Midnight Cupertino Background -->
    <linearGradient id="yos-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B0F19" />
      <stop offset="100%" stopColor="#030508" />
    </linearGradient>

    <!-- Electric Sapphire Gradient for the "Y" Monogram -->
    <linearGradient id="yos-letter" x1="120" y1="90" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="35%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>

    <!-- Glass Refraction Specular Highlight -->
    <linearGradient id="yos-shine" x1="140" y1="90" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.95" />
      <stop offset="40%" stopColor="#FFFFFF" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.0" />
    </linearGradient>

    <!-- Core Ambient Blue Glow -->
    <filter id="yos-glow" x="40" y="40" width="432" height="432" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="38" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer iOS Squircle Profile (Superellipse r=118) -->
  <rect width="512" height="512" rx="118" fill="url(#yos-bg)" />
  <rect x="2" y="2" width="508" height="508" rx="116" stroke="rgba(255,255,255,0.08)" strokeWidth="4" />
  <rect x="6" y="6" width="500" height="500" rx="112" stroke="rgba(56,189,248,0.15)" strokeWidth="2" />

  <!-- Ambient Light Emission Behind Glyph -->
  <circle cx="256" cy="240" r="140" fill="#2563EB" opacity="0.45" filter="url(#yos-glow)" />

  <!-- Monogram Glyph: Futuristic Apple "Y" Geometric Pass -->
  <!-- Left Diagonal Arm -->
  <path
    d="M 148 128 L 256 256"
    stroke="url(#yos-letter)"
    strokeWidth="56"
    strokeLinecap="round"
  />
  <path
    d="M 148 128 L 256 256"
    stroke="url(#yos-shine)"
    strokeWidth="6"
    strokeLinecap="round"
  />

  <!-- Right Diagonal Arm -->
  <path
    d="M 364 128 L 256 256"
    stroke="url(#yos-letter)"
    strokeWidth="56"
    strokeLinecap="round"
  />
  <path
    d="M 364 128 L 256 256"
    stroke="url(#yos-shine)"
    strokeWidth="6"
    strokeLinecap="round"
  />

  <!-- Vertical Stem -->
  <path
    d="M 256 256 L 256 396"
    stroke="url(#yos-letter)"
    strokeWidth="56"
    strokeLinecap="round"
  />
  <path
    d="M 256 256 L 256 396"
    stroke="url(#yos-shine)"
    strokeWidth="6"
    strokeLinecap="round"
  />

  <!-- Radiant Center Key Facet (Pure Crystal Diamond) -->
  <polygon points="256,206 288,248 256,290 224,248" fill="#FFFFFF" />
  <circle cx="256" cy="248" r="8" fill="#38BDF8" />
</svg>
