<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lmn-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B0D14" />
      <stop offset="100%" stopColor="#020305" />
    </linearGradient>
    <linearGradient id="lmn-prism" x1="120" y1="80" x2="392" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0071E3" />
      <stop offset="50%" stopColor="#5E5CE6" />
      <stop offset="100%" stopColor="#BF5AF2" />
    </linearGradient>
    <linearGradient id="lmn-spec" x1="150" y1="120" x2="360" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.05" />
    </linearGradient>
    <filter id="glow" x="60" y="60" width="392" height="392" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle (Apple iOS App Icon profile) -->
  <rect width="512" height="512" rx="115" fill="url(#lmn-bg)" />
  <rect x="2" y="2" width="508" height="508" rx="113" stroke="rgba(255,255,255,0.08)" strokeWidth="4" />
  
  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="140" fill="#0071E3" opacity="0.35" filter="url(#glow)" />
  
  <!-- Geometric Faceted Monogram Diamond -->
  <path d="M256 100L400 256L256 412L112 256L256 100Z" fill="url(#lmn-prism)" />
  <path d="M256 100L400 256L256 412L112 256L256 100Z" stroke="url(#lmn-spec)" strokeWidth="8" />
  
  <!-- Inner Dynamic Refraction Core -->
  <path d="M256 150L362 256L256 362L150 256L256 150Z" fill="url(#lmn-spec)" opacity="0.3" />
  <circle cx="256" cy="256" r="38" fill="#FFFFFF" />
</svg>
